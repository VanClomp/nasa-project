services:
  # ---------------------------------------------------------------------------
  # 1. Frontend (PHP 8.3 + Apache)
  # Korzysta z plików w głównym katalogu repozytorium (bez ich przenoszenia).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: ./2-networker/Dockerfile.frontend
    volumes:
      - ./index.php:/var/www/html/index.php:ro
      - ./explorer.php:/var/www/html/explorer.php:ro
      - ./results.php:/var/www/html/results.php:ro
      - ./style.css:/var/www/html/style.css:ro
      - ./mars_photo.jpg:/var/www/html/mars_photo.jpg:ro
      - ./moon_photo.jpg:/var/www/html/moon_photo.jpg:ro
      - ./sky_photo.jpg:/var/www/html/sky_photo.jpg:ro
    expose:
      - "80"
    networks:
      default:
        aliases:
          - 1-frontend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. Charakteryzator (Księżyc / Mars -> TargetProfile)
  # ---------------------------------------------------------------------------
  charakteryzator:
    build: ./3-charakteryzator
    environment:
      MARS_DATA_DIR: /data/mars
      MOON_DATA_DIR: /data/moon
    volumes:
      - ./data:/data:ro
    expose:
      - "8001"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Szukacz (Wyszukiwanie wektorowe na macierzach Ziemi w RAM / mmap)
  # ---------------------------------------------------------------------------
  szukacz:
    build: ./4-szukacz
    volumes:
      - ./data:/data:ro
    expose:
      - "8002"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Networker (Nginx Reverse Proxy + FastAPI API Gateway)
  # Główny punkt wejścia (porty 80 i 443).
  # ---------------------------------------------------------------------------
  networker:
    build: ./2-networker
    depends_on:
      - frontend
      - charakteryzator
      - szukacz
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CHARAKTERYZATOR_URL=http://charakteryzator:8001
      - SZUKACZ_URL=http://szukacz:8002
    volumes:
      - ./data:/data:ro
      - ./3-charakteryzator/outputs:/charakteryzator/outputs:ro
      - ./3-charakteryzator/service/norm_ranges.json:/charakteryzator/service/norm_ranges.json:ro
      - ./2-networker/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
