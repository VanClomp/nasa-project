worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 16M;

    # Kompresja odpowiedzi JSON (np. 100 kandydatów + heatmap_base64 z Szukacza)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Wewnętrzny DNS Dockera (zapobiega błędowi startu Nginx, gdy kontenery wstają równolegle)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        # Obsługa wyzwań Let's Encrypt (Certbot) po zakupie domeny
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Endpointy API obsługiwane przez lokalny proces FastAPI (port 8000)
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Bezpośredni healthcheck Networkera
        location = /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
        }

        # Cały pozostały ruch webowy przekierowany do kontenera 1-frontend (PHP 8 + Apache)
        location / {
            rewrite ^/(moon_photo|mars_photo|earth_photo|sky_photo)\.jpg$ /images/$1.jpg break;
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Dodatkowe konfiguracje (np. automatycznie wygenerowany blok HTTPS przez enable_https.sh)
    include /etc/nginx/conf.d/*.conf;
}
